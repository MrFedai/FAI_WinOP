name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      apps:
        description: 'apps işi: yalnız bu uygulamalar (virgüllü, ör. steam,chrome; boş = katalogdaki hepsi)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  ubuntu:
    name: Ubuntu · lint + birim + bundle (pwsh 7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Modülleri kur (Pester 5, PSScriptAnalyzer)
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force

      - name: Lint (PS 5.1 uyumluluğu, BOM)
        shell: pwsh
        run: ./build/Lint.ps1

      - name: Tweak kataloğu belgesi güncel mi (docs/TWEAKS.md)
        shell: pwsh
        run: ./build/TweaksDoc.ps1 -Check

      - name: README profil bölümü güncel mi (build/ProfileDoc.ps1)
        shell: pwsh
        run: ./build/ProfileDoc.ps1 -Check

      - name: Birim testleri (Pester)
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          $c = New-PesterConfiguration
          $c.Run.Path = 'tests/Unit'
          $c.Run.Exit = $true
          $c.Output.Verbosity = 'Detailed'
          $c.TestResult.Enabled = $true
          Invoke-Pester -Configuration $c

      - name: Bundle
        shell: pwsh
        run: ./build/Bundle.ps1

      - name: Bundle yükleme testi (pwsh 7, -AnyVersion)
        shell: pwsh
        run: |
          ./tests/Integration/Load-Bundle.ps1 -AnyVersion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: CLI -List (gömülü veri, pwsh 7)
        shell: pwsh
        run: |
          ./dist/install.ps1 -List
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fake sağlayıcılı bundle (yalnız test; yayınlanmaz)
        shell: pwsh
        run: ./build/Bundle.ps1 -IncludeFakes

      - name: Motor smoke testi (pwsh 7, -AnyVersion)
        shell: pwsh
        run: |
          ./tests/Integration/Engine-Smoke.ps1 -AnyVersion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: install-ps1
          path: |
            dist/install.ps1
            dist/install.ps1.sha256

  windows:
    name: Windows · bundle yükleme + motor smoke + eylem entegrasyonu (powershell.exe 5.1)
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Sürüm
        run: $PSVersionTable

      - name: Bundle (5.1 ile üret)
        run: .\build\Bundle.ps1

      - name: Bundle yükleme testi
        run: |
          .\tests\Integration\Load-Bundle.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Windows PowerShell 5.1'de de birim testleri (testi atlama: geçmeyen varsa düzeltilir ya da raporlanır).
      - name: Modülleri kur (Pester 5.7.1)
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Birim testleri (Pester, powershell.exe 5.1)
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          $c = New-PesterConfiguration
          $c.Run.Path = 'tests/Unit'
          $c.Run.Exit = $true
          $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c

      # Faz 8 kabulü: temiz runner'da tek satır (get.ps1 → SHA-256 → install.ps1) -DryRun uçtan uca; özet tutmazsa durur.
      - name: Tek satır komut (-Profile fedai -DryRun) + kurcalanmış özet
        run: |
          .\tests\Integration\OneLiner.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fake sağlayıcılı bundle (5.1 ile üret; yalnız test)
        run: .\build\Bundle.ps1 -IncludeFakes

      - name: Motor smoke testi (powershell.exe 5.1)
        run: |
          .\tests\Integration\Engine-Smoke.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Gerçek sağlayıcılar: her eylem türü uygula → doğrula → geri al (yalnız test hedefleri; runner geçici).
      - name: Windows eylem entegrasyonu (gerçek sağlayıcılar, powershell.exe 5.1)
        run: |
          .\tests\Integration\Windows-Actions.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Faz 4: katalogdaki paket kimlikleri winget'te var mı (salt okunur).
      - name: Uygulama kataloğu kimlikleri (winget show)
        run: |
          .\tests\Integration\App-Ids.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  apps:
    name: Windows · uygulama kurulumu + masaüstü / başlangıç düzeni (yalnız elle tetikleme)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Bundle (5.1 ile üret)
        run: .\build\Bundle.ps1

      - name: Uygulamaları kur → doğrula → keşif dökümü → geri al
        env:
          FAI_APPS: ${{ inputs.apps }}
        run: |
          $only = @($env:FAI_APPS -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          .\tests\Integration\Apps-Install.ps1 -Undo -Only $only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
